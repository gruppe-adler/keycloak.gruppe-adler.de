name: Test Keycloak image

# Builds the image (without pushing) and smoke-tests it, so Dependabot bumps
# of Keycloak, the extensions or the build image are checked before merging.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dependabot PRs only see Dependabot secrets, hence the fallback to
      # DEPENDABOT_GH_PACKAGES_TOKEN (the same PAT the Dependabot registries use).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: keycloak:test
          secrets: |
            gh_actor=${{ github.actor }}
            gh_token=${{ secrets.GH_PACKAGES_TOKEN || secrets.DEPENDABOT_GH_PACKAGES_TOKEN }}
          cache-from: type=gha

      - name: Smoke test
        run: tests/smoke-test.sh keycloak:test
